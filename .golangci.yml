# golangci-lint v2 configuration (keep in sync with CI's pinned version).
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Fire-and-forget patterns we'd otherwise annotate everywhere.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
