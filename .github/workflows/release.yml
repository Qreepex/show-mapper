name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux-amd64,
              os: ubuntu-latest,
              goos: linux,
              goarch: amd64,
              ext: "",
              packaging: tar,
            }
          - {
              name: linux-arm64,
              os: ubuntu-24.04-arm,
              goos: linux,
              goarch: arm64,
              ext: "",
              packaging: tar,
            }
          - {
              name: windows-amd64,
              os: windows-latest,
              goos: windows,
              goarch: amd64,
              ext: ".exe",
              packaging: zip,
            }
          - {
              name: darwin-amd64,
              os: macos-13,
              goos: darwin,
              goarch: amd64,
              ext: "",
              packaging: tar,
            }
          - {
              name: darwin-arm64,
              os: macos-latest,
              goos: darwin,
              goarch: arm64,
              ext: "",
              packaging: tar,
            }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI (embedded into the binary)
        working-directory: web
        run: npm ci && npm run build

      - name: Linux CGo build deps (ALSA headers for RtMidi)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Windows CGo toolchain (MinGW-w64 via msys2)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build binary (CGO on)
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Explicit toolchain paths keep us independent of PATH quirks (msys2/git-bash).
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          if [ "${{ matrix.goos }}" = windows ]; then
            export CC='/c/msys64/ucrt64/bin/gcc.exe'
            export CXX='/c/msys64/ucrt64/bin/g++.exe'
          fi
          ver="${GITHUB_REF_NAME#v}"
          out="dist/${{ matrix.name }}/show-mapper${{ matrix.ext }}"
          mkdir -p "dist/${{ matrix.name }}"
          go build -trimpath -ldflags "-s -w \
            -X github.com/qreepex/show-mapper/internal/version.Version=${ver} \
            -X github.com/qreepex/show-mapper/internal/version.Commit=${GITHUB_SHA} \
            -X github.com/qreepex/show-mapper/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$out" ./cmd/show-mapper
          cp README.md LICENSE show-mapper.example.yaml "dist/${{ matrix.name }}/"
          "./dist/${{ matrix.name }}/show-mapper${{ matrix.ext }}" version

      - name: Package (tar.gz)
        if: matrix.packaging == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf "show-mapper_${GITHUB_REF_NAME#v}_${{ matrix.name }}.tar.gz" -C "${{ matrix.name }}" .

      - name: Package (zip)
        if: matrix.packaging == 'zip'
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Compress-Archive -Path "dist/${{ matrix.name }}/*" -DestinationPath "dist/show-mapper_${ver}_${{ matrix.name }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/show-mapper_*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkgs
          merge-multiple: true
      - name: checksums
        run: |
          cd pkgs
          sha256sum show-mapper_* | tee checksums.txt
          ls -la
      - uses: softprops/action-gh-release@v3
        with:
          files: pkgs/*
          generate_release_notes: true
